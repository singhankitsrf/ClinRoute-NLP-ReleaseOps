name: Container Release
on:
  push:
    tags: ["v*.*.*"]
permissions: {contents: read, packages: write, attestations: write, id-token: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_synthetic_data.py --rows 3000 --seed 42
      - run: python scripts/check_data_contract.py
      - run: ruff check . && mypy src && pytest -q && bandit -q -r src scripts
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e . && python scripts/generate_synthetic_data.py --rows 3000 --seed 42 && python training/train_baseline.py && python scripts/build_release_manifest.py --model-dir models/baseline --metrics artifacts/baseline_metrics.json
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
